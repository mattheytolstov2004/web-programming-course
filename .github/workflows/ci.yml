name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lessons/lr11/quiz-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: lessons/lr11/quiz-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lessons/lr11/quiz-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: lessons/lr11/quiz-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: lessons/lr11/quiz-backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quiz-backend:ci .